name: Summit County Lead Scrape

# Independent of the Franklin (scrape.yml) and Cuyahoga (scrape-cuyahoga.yml) workflows on purpose:
# own schedule, own concurrency group, own job. The only thing shared is the repo and the dashboard/
# folder. This job does NOT deploy GitHub Pages; Franklin's scrape.yml owns that and uploads the whole
# dashboard/ folder, so dashboard/summit.json and dashboard/summit_ghl_export.csv must already be
# committed by then. 05:30 UTC leaves a buffer before Franklin's 07:00 UTC run.

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scrape-summit"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: summit-foreclosure-scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: summit-foreclosure-scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium (the clerk feed is JavaScript-rendered)
        run: python -m playwright install --with-deps chromium

      - name: Run offline tests
        run: python -m pytest -q tests

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd src
          python run_pipeline.py

      - name: Commit and push updated leads + dashboard data
        run: |
          git config user.name "summit-lead-bot"
          git config user.email "actions@users.noreply.github.com"
          cd ..
          git add summit-foreclosure-scraper/data/leads.json dashboard/summit.json dashboard/summit_ghl_export.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Summit lead scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Upload debug page if the feed parsed nothing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-last-feed
          path: summit-foreclosure-scraper/data/last_feed.html
          if-no-files-found: ignore
          retention-days: 7
