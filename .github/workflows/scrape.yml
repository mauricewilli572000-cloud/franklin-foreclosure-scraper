name: Franklin County Lead Scrape

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily (~3:00 AM America/New_York)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-and-pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml playwright pdfplumber pytesseract PyMuPDF Pillow

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Diagnose Tesseract (sanity check before the full run)
        run: |
          echo "--- tesseract --version ---"
          tesseract --version
          echo "--- tessdata location ---"
          find / -iname "eng.traineddata" 2>/dev/null || echo "eng.traineddata NOT FOUND anywhere on disk"
          echo "--- TESSDATA_PREFIX env var ---"
          echo "TESSDATA_PREFIX=$TESSDATA_PREFIX"
          echo "--- standalone pytesseract test (generates its own test image) ---"
          python - <<'EOF'
          import time
          from PIL import Image, ImageDraw
          import pytesseract

          img = Image.new("RGB", (400, 100), "white")
          d = ImageDraw.Draw(img)
          d.text((10, 10), "Hello 12345", fill="black")

          start = time.time()
          try:
              text = pytesseract.image_to_string(img, timeout=20)
              print(f"OCR SUCCEEDED in {time.time() - start:.1f}s. Result: {text!r}")
          except Exception as exc:
              print(f"OCR FAILED after {time.time() - start:.1f}s: {exc!r}")
          EOF

      - name: Run scraper
        run: python scraper/fetch.py
        env:
          PYTHONUNBUFFERED: "1"
          # GitHub's standard runners have only 2 CPU cores — running
          # documents concurrently here causes severe CPU contention
          # during OCR (confirmed: Tesseract works fine in isolation but
          # timed out 100% of the time under 3-way concurrency).
          # Sequential processing is slower but reliable in CI.
          DOCUMENT_ENRICHMENT_CONCURRENCY: "1"

      - name: Commit and push updated records
        run: |
          git config user.name "franklin-lead-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/records.json data/records.json dashboard/ghl_export.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated lead scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload dashboard artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
