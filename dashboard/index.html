<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motivated Seller Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Motivated Seller Leads</h1>
    <p class="tagline">Pick a dashboard. Each one is updated by its own nightly scrape.</p>
  </header>
  <div class="cards" id="cards"></div>
</div>
<script src="dashboards.js"></script>
<script>
  const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  document.getElementById('cards').innerHTML = window.DASHBOARDS.filter(d => d.url).map(d => `
    <a class="card" href="${esc(d.url)}">
      <h2>${esc(d.label)}</h2>
      <p>${esc(d.blurb)}</p>
      ${d.tabs ? `<div class="tabs">${esc(d.tabs)}</div>` : ''}
    </a>`).join('');
</script>
</body>
</html>
